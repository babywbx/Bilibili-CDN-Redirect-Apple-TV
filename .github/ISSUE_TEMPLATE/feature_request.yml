name: 功能建议 / Feature request
description: 提出一个新功能或改进 / Propose a new feature or an improvement
labels: ["enhancement"]
assignees: ["babywbx"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我搜索过现有 issue，没有重复 / I searched the existing issues and found no duplicate
          required: true
        - label: 我确认 README 里没有已经支持的做法 / I checked the README and this is not already supported
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / The problem
      description: 描述你遇到的实际情况，而不是直接给方案 / Describe the situation you hit, not the solution you have in mind
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它做法 / Alternatives considered
      description: 包括现有参数的组合能否绕过 / Including whether existing arguments can already work around it

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围 / Affected parts
      multiple: true
      options:
        - Surge 模块 / Surge module
        - Loon 插件 / Loon plugin
        - 改写脚本 / Rewrite script
        - 证书工具 / Certificate tool
        - 文档 / Documentation
